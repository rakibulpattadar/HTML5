<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flex box</title>
    <link rel="stylesheet" href="style/nav.css">
    <style>
        .container div{
            border: 2px solid tomato;
            width: 200px;
            height: 150px;
            font-size: 3em;
           
        }
        .container{
            display: flex;
        }
        .box-container{
            display: flex;
            gap: 20px;
            justify-content: space-between;
        }
        .box{
            border: 2px solid blue;
            width: 200px;
            height: 150px;
            font-size: 4em;
        }
        .card{
            width: 150px;
            height: 150px;
            font-size: 2em;
            border: 2px solid salmon;
            background-color: aqua;
           
        }
        .card-container{
            display: flex;
            gap: 20px;
            flex-wrap: wrap;
            justify-content: end;

        }
        
    </style>
</head>
<body>

    <header>
          <nav>
        <ul>
            <li><a href="flex.html">Flex</a></li>
            <li><a href="from.html">from</a></li>
            <li><a href="video.html">video</a></li>
            <li><a href="table.html">Table</a></li>
            <li><a href="auto.html">Auto</a></li>
        </ul>
    </nav>
    </header>

 <main>
       <div class="container">
        <div>1</div>
        <div>2</div>
        <div>3</div>
        <div>4</div>
        <div>5</div>
        <div>6</div>
    </div>
    <div class="box-container">
      <div class="box">1</div>
      <div class="box">2</div>
      <div class="box">3</div>
    </div>
    <div class="card-container">
        <div class="card">user-1</div>
        <div class="card">user-2</div>
        <div class="card">user-3</div>
        <div class="card">user-4</div>
        <div class="card">user-5</div>
        <div class="card">user-6</div>
        <div class="card">user-7</div>
        <div class="card">user-8</div>
        <div class="card">user-9</div>
        <div class="card">user-10</div>
        <div class="card">user-11</div>
        <div class="card">user-12</div>
    </div>
   
 </main>
    
</body>
</html>
